<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Sunset Glow Gradient -->
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ea6045" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Path/Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444c56" />
      <stop offset="100%" stop-color="#22272e" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf00" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Apple Gradient -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#b50e0e" />
    </linearGradient>

    <!-- Neon Trail Gradient -->
    <linearGradient id="neonTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="400" fill="url(#skyGrad)" />
  <circle cx="960" cy="120" r="250" fill="url(#sunGlow)" />

  <!-- 2. Sky Elements (Stars and Clouds) -->
  <g opacity="0.4">
    <circle cx="150" cy="80" r="1.5" fill="#fff" />
    <circle cx="350" cy="50" r="1" fill="#fff" />
    <circle cx="550" cy="120" r="2" fill="#fff" />
    <circle cx="850" cy="60" r="1" fill="#fff" />
    <circle cx="1100" cy="150" r="1.5" fill="#fff" />
  </g>

  <!-- Low Poly Clouds -->
  <g fill="#30363d" opacity="0.3" filter="url(#shadow)">
    <!-- Cloud Left -->
    <path d="M-50,200 L50,150 L150,170 L250,140 L300,220 Z" />
    <!-- Cloud Right -->
    <path d="M900,180 L1000,120 L1150,150 L1300,110 L1250,220 Z" />
  </g>

  <!-- 3. The Running Bridge (Perspective view from behind, but looking ahead) -->
  <!-- Left Wall / Pillars -->
  <path d="M 0,350 L 400,240 L 800,240 L 1200,350 L 1200,400 L 0,400 Z" fill="url(#bridgeGrad)" opacity="0.9" />
  <!-- Bridge Grid & Perspective Lines -->
  <g stroke="#444c56" stroke-width="2" opacity="0.6">
    <line x1="600" y1="240" x2="600" y2="400" />
    <line x1="600" y1="240" x2="300" y2="400" />
    <line x1="600" y1="240" x2="900" y2="400" />
    <line x1="600" y1="240" x2="0" y2="400" />
    <line x1="600" y1="240" x2="1200" y2="400" />
    
    <!-- Horizontal Planks -->
    <line x1="500" y1="260" x2="700" y2="260" />
    <line x1="420" y1="290" x2="780" y2="290" />
    <line x1="300" y1="330" x2="900" y2="330" />
    <line x1="120" y1="370" x2="1080" y2="370" />
  </g>

  <!-- Side Railings (Stone pillars low poly style) -->
  <g fill="#21262d" stroke="#30363d" stroke-width="1">
    <!-- Left Railing -->
    <polygon points="0,350 400,240 395,235 -5,340" />
    <!-- Right Railing -->
    <polygon points="1200,350 800,240 805,235 1205,340" />
  </g>

  <!-- Lantern Posts (Low Poly) -->
  <g fill="#30363d">
    <!-- Left Post -->
    <path d="M 150,320 L 150,220 L 175,200 L 175,210 L 160,225 L 160,320 Z" />
    <!-- Left Lantern Glow -->
    <polygon points="165,225 185,225 180,245 170,245" fill="#f8e3a1" filter="url(#neonGlow)" opacity="0.8" />
    
    <!-- Right Post -->
    <path d="M 1050,320 L 1050,220 L 1025,200 L 1025,210 L 1040,225 L 1040,320 Z" />
    <!-- Right Lantern Glow -->
    <polygon points="1035,225 1015,225 1020,245 1030,245" fill="#f8e3a1" filter="url(#neonGlow)" opacity="0.8" />
  </g>

  <!-- 4. Gamified Pickups: Coins & Apples -->
  <!-- Floating Coin 1 -->
  <g transform="translate(420, 260)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="url(#goldGrad)" />
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.8" />
    <!-- Light Glow -->
    <circle cx="0" cy="0" r="18" fill="#ffdf00" opacity="0.2" filter="url(#neonGlow)" />
  </g>
  <!-- Floating Coin 2 -->
  <g transform="translate(470, 290)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="18" ry="26" fill="url(#goldGrad)" />
    <ellipse cx="0" cy="0" rx="10" ry="16" fill="none" stroke="#fff" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="0" r="24" fill="#ffdf00" opacity="0.2" filter="url(#neonGlow)" />
  </g>

  <!-- Apple Pickup -->
  <g transform="translate(740, 295)" filter="url(#shadow)">
    <circle cx="0" cy="5" r="20" fill="url(#appleGrad)" />
    <!-- Apple indent & leaf -->
    <path d="M -5,-14 Q 0,-18 5,-14 Q 0,-10 -5,-14" fill="#58a6ff" />
    <path d="M 0,-15 Q 10,-25 8,-10" fill="#3fb950" />
    <circle cx="0" cy="5" r="22" fill="#ff453a" opacity="0.15" filter="url(#neonGlow)" />
  </g>

  <!-- 5. Running King Silhouette/Low-Poly Stylized Vector -->
  <!-- A beautiful gradient trail behind him for motion feel -->
  <path d="M 400,360 Q 500,320 570,335 L 565,345 Q 490,330 400,375 Z" fill="url(#neonTrail)" filter="url(#neonGlow)" />
  <path d="M 350,335 Q 480,310 575,328 L 570,335 Q 470,315 350,345 Z" fill="url(#neonTrail)" filter="url(#neonGlow)" opacity="0.6" />

  <!-- The Runner (Stylized polygonal/low-poly elements representing the King Running) -->
  <g transform="translate(560, 240)">
    <!-- Shadow underneath -->
    <ellipse cx="10" cy="95" rx="35" ry="8" fill="#000" opacity="0.6" />
    
    <!-- Left Leg (Running Backwards) -->
    <polygon points="5,60 -20,80 -10,85 10,65" fill="#30363d" />
    <polygon points="-20,80 -25,95 -15,96 -10,85" fill="#8b5cf6" />
    
    <!-- Right Leg (Running Forward) -->
    <polygon points="20,60 35,80 25,92 10,65" fill="#21262d" />
    <polygon points="35,80 42,90 35,93 25,92" fill="#d4af37" />

    <!-- Royal Purple Robe/Coat Tail (Wind blown effect) -->
    <polygon points="-5,25 -45,45 -35,55 10,40" fill="#8957e5" />
    <polygon points="-15,30 -55,38 -45,48 -5,35" fill="#6f3cc9" opacity="0.9" />

    <!-- Torso (Polygonal) -->
    <polygon points="-5,25 25,22 20,60 -5,55" fill="#8957e5" />
    <polygon points="5,23 25,22 20,60 10,57" fill="#b083ff" /> <!-- Highlight -->
    <!-- Gold Trim / Belt -->
    <polygon points="-3,48 22,45 20,53 -4,55" fill="#d4af37" />
    <!-- Cyan Gem on Belt -->
    <polygon points="8,46 13,42 16,46 13,50" fill="#58a6ff" />

    <!-- Arms -->
    <!-- Left Arm (Swinging Forward) -->
    <polygon points="20,25 35,38 30,44 15,30" fill="#30363d" />
    <polygon points="35,38 40,50 34,53 30,44" fill="#f8e3a1" />
    <!-- Right Arm (Swinging Backwards) -->
    <polygon points="-3,25 -20,35 -15,40 5,30" fill="#21262d" />

    <!-- Gold Crown & Head -->
    <!-- Beard (Low-poly gray/white) -->
    <polygon points="12,10 25,12 22,25 10,22" fill="#f0f6fc" />
    <polygon points="20,12 26,13 25,24 22,25" fill="#c9d1d9" />
    <!-- Face -->
    <polygon points="10,5 22,7 20,16 8,14" fill="#f8e3a1" />
    <!-- Crown -->
    <polygon points="8,3 24,5 22,-8 17,-2 15,-8 11,-2 8,-7" fill="#d4af37" />
    <polygon points="15,-8 22,-8 17,-2" fill="#ffdf00" />
    <polygon points="13,-2 17,-2 15,3" fill="#58a6ff" /> <!-- Crown Gem -->
  </g>

  <!-- 6. Niagara Particle / Speed Lines & Visual Effects -->
  <g stroke="#fff" opacity="0.3" stroke-linecap="round">
    <!-- Fast speed lines -->
    <line x1="100" y1="280" x2="250" y2="280" stroke-width="1.5" />
    <line x1="80" y1="310" x2="180" y2="310" stroke-width="2" />
    <line x1="950" y1="270" x2="1100" y2="270" stroke-width="1.5" />
    <line x1="1020" y1="300" x2="1150" y2="300" stroke-width="2" />
    <line x1="50" y1="150" x2="200" y2="150" stroke-width="1" opacity="0.2" />
    <line x1="980" y1="170" x2="1120" y2="170" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Niagara Sparkles / Magic Orbs (Glow effect) -->
  <g fill="#ff7b72" opacity="0.8">
    <circle cx="530" cy="270" r="3" filter="url(#neonGlow)" />
    <circle cx="545" cy="300" r="2" filter="url(#neonGlow)" />
    <circle cx="510" cy="315" r="4" fill="#bc8cff" filter="url(#neonGlow)" />
    <circle cx="490" cy="285" r="2.5" fill="#58a6ff" filter="url(#neonGlow)" />
  </g>

  <!-- 7. Typography (Logo / Title overlay) -->
  <!-- Main Title -->
  <text x="75" y="75" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2" filter="url(#shadow)">
    ROYAL RUN
  </text>
  <text x="75" y="115" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ff7b72" letter-spacing="6" opacity="0.9">
    ESCAPE THE SKIES
  </text>

  <!-- Version / Engine Badge -->
  <g transform="translate(75, 135)" opacity="0.9">
    <rect width="90" height="24" rx="12" fill="#ff7b72" />
    <text x="45" y="16" font-family="sans-serif" font-size="11" font-weight="900" fill="#0d1117" text-anchor="middle">UNITY 6</text>
    
    <rect x="98" width="130" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" />
    <text x="163" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">PCG RUNNER</text>
  </g>

  <!-- Running Stats Indicator (Gamified UI look) -->
  <g transform="translate(1000, 45)" filter="url(#shadow)">
    <!-- Time Box -->
    <rect width="120" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="60" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">TIME LIMIT</text>
    <text x="60" y="42" font-family="monospace" font-size="20" font-weight="900" fill="#ff7b72" text-anchor="middle">0.9s</text>
  </g>

  <g transform="translate(860, 45)" filter="url(#shadow)">
    <!-- Score Box -->
    <rect width="120" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="60" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">TOTAL SCORE</text>
    <text x="60" y="42" font-family="monospace" font-size="20" font-weight="900" fill="#d4af37" text-anchor="middle">400</text>
  </g>
</svg>
